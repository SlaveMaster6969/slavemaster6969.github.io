<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROBCO Industries (TM) Termlink</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        color: #33ff66;
        font-family: "Courier New", monospace;
        overflow: hidden;
    }

    .crt {
        width: 100%;
        height: 100%;
        padding: 40px;
        box-sizing: border-box;
        background: black;
        text-shadow: 0 0 8px #33ff66;
        position: relative;
    }

    /* Scanlines */
    .crt::after {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.1) 0px,
            rgba(0, 0, 0, 0.1) 2px,
            rgba(0, 0, 0, 0.2) 3px
        );
        mix-blend-mode: multiply;
    }

    h1 {
        margin: 0 0 20px 0;
        font-size: 22px;
    }

    .menu {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .menu a {
        color: #33ff66;
        text-decoration: none;
        font-size: 20px;
        padding: 6px 0;
        display: inline-block;
        transition: 0.1s;
    }

    .menu a:hover {
        background: rgba(51, 255, 102, 0.2);
        padding-left: 10px;
    }

    .footer {
        position: absolute;
        bottom: 20px;
        left: 40px;
        font-size: 16px;
        opacity: 0.8;
    }
</style>
</head>
<body>
<div class="crt">
    <h1>Welcome to ROBCO Industries (TM) Termlink</h1>
    <div>------------------------------------------</div>
    <div>Select an option:</div>

    <div class="menu">
        <!-- ADD NEW BUTTONS HERE -->
        <a href="/file.html">Open File</a>
        <a href="https://example.com">Visit Example.com</a>
        <!-- Just copy/paste to add more -->
    </div>

    <div class="footer">ROBCO Industries ©2075</div>
</div>
</body>
</html>
