<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROBCO Industries (TM) Termlink</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Courier New", monospace;
        color: #33ff66;
    }

    .screen-wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: stretch;
        justify-content: center;
        background: radial-gradient(circle at 50% 20%, #022 0%, #000 60%, #000 100%);
    }

    #crt {
        width: 100%;
        max-width: 1100px;
        height: 100%;
        padding: 40px;
        box-sizing: border-box;
        position: relative;
        text-shadow: 0 0 8px #33ff66;
        filter: contrast(1.2) brightness(1.1);
        transform: perspective(900px) rotateX(3deg);
        overflow: hidden;
    }

    #crt::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 50% -20%, rgba(255,255,255,0.12), transparent 60%),
            radial-gradient(circle at 50% 120%, rgba(0,0,0,0.7), transparent 70%);
        mix-blend-mode: screen;
        pointer-events: none;
    }

    #crt::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0,0,0,0.18) 0px,
            rgba(0,0,0,0.18) 2px,
            rgba(0,0,0,0.28) 3px
        );
        mix-blend-mode: multiply;
        opacity: 0.9;
    }

    .flicker {
        animation: flicker 0.18s infinite alternate;
    }

    @keyframes flicker {
        from { opacity: 0.96; }
        to   { opacity: 1; }
    }

    #content {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        white-space: pre-wrap;
        font-size: 18px;
        line-height: 1.4;
    }

    .status-line {
        position: absolute;
        bottom: 18px;
        left: 40px;
        font-size: 14px;
        opacity: 0.8;
        z-index: 2;
    }

    .cursor {
        display: inline-block;
        width: 10px;
        animation: blink 0.8s steps(1) infinite;
    }

    @keyframes blink {
        0%, 50% { opacity: 1; }
        51%,100% { opacity: 0; }
    }

    .selected {
        background: rgba(51,255,102,0.25);
    }

    .error {
        color: #ff5555;
        text-shadow: 0 0 8px #ff5555;
    }

    .locked {
        opacity: 0.6;
    }

    .hack-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        column-gap: 4ch;
    }

    .hack-col {
        white-space: pre;
    }
</style>
</head>
<body>
<div class="screen-wrap">
    <div id="crt" class="flicker">
        <div id="content"></div>
        <div class="status-line" id="statusLine">ROBCO Industries ©2075</div>
    </div>
</div>

<script>
/* ================================
   CONFIG
================================ */

const TYPE_SPEED = 12; // ms per char (fast typewriter)

const menuItems = [
    { id: "logs",      label: "Access Logs",        type: "logs" },
    { id: "security",  label: "Security Control",   type: "hack" },
    { id: "system",    label: "System Diagnostics", type: "page" },
    { id: "archives",  label: "Archived Messages",  type: "page", locked: true },
    { id: "exit",      label: "Exit Terminal",      type: "exit" }
];

const logsData = [
    {
        title: "LOG 01 - INITIALIZATION",
        body: "System brought online.\nAll subsystems nominal.\nAwaiting further instructions."
    },
    {
        title: "LOG 02 - INCIDENT REPORT",
        body: "Unauthorized access attempt detected.\nSource: UNKNOWN.\nSecurity protocols elevated."
    },
    {
        title: "LOG 03 - UPLINK FAILURE",
        body: "External network uplink lost.\nFallback to local-only mode.\nOperator notification pending."
    }
];

const systemDiagnosticsText =
"ROBCO INDUSTRIES (TM) DIAGNOSTICS\n" +
"---------------------------------\n" +
"CPU STATUS:        OK\n" +
"MEMORY INTEGRITY:  OK\n" +
"DISK STATUS:       OK\n" +
"NETWORK LINK:      DEGRADED\n" +
"\n" +
"NOTE: External uplink unstable.\n";

const archivesLockedText =
"ARCHIVE ACCESS DENIED\n" +
"---------------------\n" +
"User clearance insufficient.\nContact your system administrator.\n";

const hackingWordsBase = [
    "PROTECT", "SYSTEM", "ACCESS", "VAULT", "ROBOTS",
    "SECURE", "TERMINAL", "NETWORK", "OVERRIDE", "ENCRYPT",
    "FISSION", "CONTROL", "COMMAND", "FAILURE", "UPLINK"
];

let hackingWords = [];
let hackingPassword = "";
const hackingAttemptsMax = 4;
let hackingAttemptsLeft = hackingAttemptsMax;

/* ================================
   STATE
================================ */

let mode = "boot";      // boot | loading | menu | logs | page | hack | error
let selectedIndex = 0;
let currentLogIndex = 0;
let typing = false;
let queuedRender = null;
let hackBuffer = "";

/* ================================
   DOM
================================ */

const contentEl = document.getElementById("content");
const statusLine = document.getElementById("statusLine");

/* ================================
   UTIL: TYPEWRITER
================================ */

function setStatus(text) {
    statusLine.textContent = text;
}

function typeText(text, cb, speed = TYPE_SPEED) {
    typing = true;
    contentEl.textContent = "";
    let i = 0;
    const interval = setInterval(() => {
        contentEl.textContent += text[i] || "";
        i++;
        if (i >= text.length) {
            clearInterval(interval);
            typing = false;
            if (cb) cb();
            if (queuedRender) {
                const fn = queuedRender;
                queuedRender = null;
                fn();
            }
        }
    }, speed);
}

function typeHTML(html, cb, speed = TYPE_SPEED) {
    typing = true;
    contentEl.innerHTML = "";
    let i = 0;
    const interval = setInterval(() => {
        contentEl.innerHTML = html.slice(0, i);
        i++;
        if (i >= html.length) {
            clearInterval(interval);
            typing = false;
            if (cb) cb();
            if (queuedRender) {
                const fn = queuedRender;
                queuedRender = null;
                fn();
            }
        }
    }, speed);
}

function safeRender(fn) {
    if (typing) {
        queuedRender = fn;
    } else {
        fn();
    }
}

/* ================================
   BOOT + LOADING
================================ */

function renderBoot() {
    mode = "boot";
    const bootText =
"ROBCO Industries (TM) Termlink\n" +
"Initializing System...\n" +
"Loading Modules...\n" +
"Boot Complete.\n\n" +
"Press any key to continue.\n";
    typeText(bootText, () => {
        setStatus("Press any key to continue.");
    });
}

function renderLoading(nextModeFn, label = "LOADING") {
    mode = "loading";
    const dots = "...";
    let text =
label + "\n" +
"----------------\n" +
"Please wait";
    let i = 0;
    typeText(text, () => {
        const interval = setInterval(() => {
            if (mode !== "loading") { clearInterval(interval); return; }
            i = (i + 1) % (dots.length + 1);
            contentEl.textContent = text + dots.slice(0, i);
        }, 200);
        setTimeout(() => {
            clearInterval(interval);
            safeRender(nextModeFn);
        }, 1200);
    }, 8);
}

/* ================================
   MENU
================================ */

function renderMenu() {
    mode = "menu";
    let out = "";
    out += "Welcome to ROBCO Industries (TM) Termlink\n";
    out += "------------------------------------------\n";
    out += "Select an option:\n\n";

    menuItems.forEach((item, i) => {
        const prefix = (i === selectedIndex) ? "> " : "  ";
        const lockedMark = item.locked ? " [LOCKED]" : "";
        out += prefix + item.label + lockedMark + "\n";
    });

    typeText(out, () => {
        setStatus("Use ↑/↓ and ENTER to navigate.");
    });
}

/* ================================
   LOGS
================================ */

function renderLogs() {
    mode = "logs";
    const log = logsData[currentLogIndex];
    let out = "";
    out += "LOG ENTRIES\n";
    out += "-----------\n\n";
    out += log.title + "\n\n";
    out += log.body + "\n\n";
    out += "[←/→] Switch logs   [ESC] Back\n";
    typeText(out, () => {
        setStatus("Viewing log " + (currentLogIndex + 1) + " of " + logsData.length);
    });
}

/* ================================
   PAGES
================================ */

function renderPage(id) {
    mode = "page";
    let out = "";
    if (id === "system") {
        out += systemDiagnosticsText;
    } else if (id === "archives") {
        if (menuItems.find(m => m.id === "archives").locked) {
            out += archivesLockedText;
        } else {
            out += "ARCHIVED MESSAGES\n-----------------\n(No data.)\n";
        }
    }
    out += "\n[ESC] Return to main menu\n";
    typeText(out, () => {
        setStatus("Page: " + id.toUpperCase());
    });
}

/* ================================
   ERROR
================================ */

function renderError(message) {
    mode = "error";
    let out = "";
    out += "!!! TERMINAL ERROR !!!\n";
    out += "-----------------------\n\n";
    out += message + "\n\n";
    out += "[ESC] Return to main menu\n";
    typeText(out, () => {
        setStatus("Error state");
    });
}

/* ================================
   HACKING (FO4-STYLE)
================================ */

function initHack() {
    // pick subset of words
    hackingWords = [];
    const pool = [...hackingWordsBase];
    while (hackingWords.length < 10 && pool.length) {
        const idx = Math.floor(Math.random() * pool.length);
        hackingWords.push(pool.splice(idx, 1)[0]);
    }
    hackingPassword = hackingWords[Math.floor(Math.random() * hackingWords.length)];
    hackingAttemptsLeft = hackingAttemptsMax;
    hackBuffer = "";
}

function generateHackGrid() {
    // FO4-ish: hex addresses + random chars + embedded words
    const cols = 2;
    const rows = 16;
    const colWidth = 24;
    const charset = "{}[]()<>!@#$%^&*+-/\\|;:,.ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const gridCols = [[], []];

    function randomChar() {
        return charset[Math.floor(Math.random() * charset.length)];
    }

    // start addresses
    let baseAddr = 0xF7A0;
    for (let c = 0; c < cols; c++) {
        let addr = baseAddr + c * 0x10;
        for (let r = 0; r < rows; r++) {
            let line = "0x" + addr.toString(16).toUpperCase().padStart(4, "0") + " ";
            let chars = "";
            for (let i = 0; i < colWidth; i++) chars += randomChar();
            gridCols[c].push({ addr, chars });
            addr += 0x10;
        }
    }

    // embed words randomly
    hackingWords.forEach(word => {
        const c = Math.floor(Math.random() * cols);
        const r = Math.floor(Math.random() * rows);
        const line = gridCols[c][r];
        const maxStart = colWidth - word.length;
        const start = Math.floor(Math.random() * Math.max(1, maxStart));
        let charsArr = line.chars.split("");
        for (let i = 0; i < word.length; i++) {
            charsArr[start + i] = word[i];
        }
        line.chars = charsArr.join("");
    });

    let colHtml = ["", ""];
    for (let c = 0; c < cols; c++) {
        gridCols[c].forEach(row => {
            colHtml[c] +=
                "0x" + row.addr.toString(16).toUpperCase().padStart(4, "0") +
                " " + row.chars + "\n";
        });
    }

    return `
SECURITY GATEWAY
----------------
Attempts remaining: ${hackingAttemptsLeft}

${wrapHackGrid(colHtml[0], colHtml[1])}

GUESS THE PASSWORD:
Type your guess and press ENTER.
Input: `;
}

function wrapHackGrid(col1, col2) {
    // We'll render as two columns using spans and CSS grid
    const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return `<div class="hack-grid">
<div class="hack-col">${esc(col1)}</div>
<div class="hack-col">${esc(col2)}</div>
</div>`;
}

function renderHackIntro() {
    mode = "hack";
    initHack();
    const html = generateHackGrid();
    typeHTML(html + "\n", () => {
        attachInputCursor();
        setStatus("Hacking: attempts remaining " + hackingAttemptsLeft);
    }, 2);
}

function attachInputCursor(current = "") {
    const text = contentEl.innerHTML;
    const idx = text.lastIndexOf("Input:");
    let base = text;
    if (idx !== -1) {
        base = text.slice(0, idx) + "Input: " + current;
    }
    contentEl.innerHTML = base + '<span class="cursor">█</span>';
}

function likeness(a, b) {
    let same = 0;
    for (let i = 0; i < Math.min(a.length, b.length); i++) {
        if (a[i] === b[i]) same++;
    }
    return same;
}

function appendHackLine(text) {
    const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const base = contentEl.innerHTML.replace(/<span class="cursor">█<\/span>/, "");
    contentEl.innerHTML = base + esc(text);
}

/* ================================
   INPUT HANDLING
================================ */

document.addEventListener("keydown", (e) => {
    if (typing && mode !== "hack") {
        // allow skip typing by pressing any key
        typing = false;
        queuedRender && queuedRender();
        queuedRender = null;
        return;
    }

    if (mode === "boot") {
        renderLoading(renderMenu, "LOADING TERMINAL");
        return;
    }

    if (mode === "loading") {
        return;
    }

    if (mode === "menu") {
        if (e.key === "ArrowDown") {
            selectedIndex = (selectedIndex + 1) % menuItems.length;
            safeRender(renderMenu);
        } else if (e.key === "ArrowUp") {
            selectedIndex = (selectedIndex - 1 + menuItems.length) % menuItems.length;
            safeRender(renderMenu);
        } else if (e.key === "Enter") {
            const item = menuItems[selectedIndex];
            handleMenuSelect(item);
        }
        return;
    }

    if (mode === "logs") {
        if (e.key === "ArrowRight") {
            currentLogIndex = (currentLogIndex + 1) % logsData.length;
            safeRender(renderLogs);
        } else if (e.key === "ArrowLeft") {
            currentLogIndex = (currentLogIndex - 1 + logsData.length) % logsData.length;
            safeRender(renderLogs);
        } else if (e.key === "Escape") {
            renderLoading(renderMenu, "RETURNING");
        }
        return;
    }

    if (mode === "page" || mode === "error") {
        if (e.key === "Escape") {
            renderLoading(renderMenu, "RETURNING");
        }
        return;
    }

    if (mode === "hack") {
        if (e.key === "Escape") {
            renderLoading(renderMenu, "ABORTING");
            return;
        }

        if (e.key === "Backspace") {
            hackBuffer = hackBuffer.slice(0, -1);
            attachInputCursor(hackBuffer);
            e.preventDefault();
            return;
        }

        if (e.key === "Enter") {
            processHackGuess();
            return;
        }

        if (e.key.length === 1 && /[A-Za-z]/.test(e.key)) {
            hackBuffer += e.key.toUpperCase();
            attachInputCursor(hackBuffer);
        }
        return;
    }
});

function handleMenuSelect(item) {
    if (item.locked) {
        renderError("ACCESS TO \"" + item.label.toUpperCase() + "\" IS RESTRICTED.");
        return;
    }

    switch (item.type) {
        case "logs":
            currentLogIndex = 0;
            renderLoading(renderLogs, "OPENING LOGS");
            break;
        case "page":
            renderLoading(() => renderPage(item.id), "OPENING");
            break;
        case "hack":
            renderLoading(renderHackIntro, "INITIALIZING SECURITY");
            break;
        case "exit":
            renderError("TERMINAL SESSION ENDED.\nYou may now close this window.");
            break;
        default:
            renderError("UNKNOWN MENU ACTION.");
    }
}

/* ================================
   HACKING LOGIC
================================ */

function processHackGuess() {
    const guess = hackBuffer;
    hackBuffer = "";

    if (!guess) {
        attachInputCursor("");
        return;
    }

    if (!hackingWords.includes(guess)) {
        appendHackLine("\n" + guess + "  >> INVALID ENTRY");
        attachInputCursor("");
        return;
    }

    if (guess === hackingPassword) {
        appendHackLine("\n" + guess + "  >> ACCESS GRANTED\n");
        appendHackLine("\nSECURITY OVERRIDE ENABLED.\n[ESC] Return to main menu.\n");
        setStatus("Security unlocked.");
        mode = "page";
        return;
    }

    hackingAttemptsLeft--;
    const like = likeness(guess, hackingPassword);
    appendHackLine("\n" + guess + "  >> LIKENESS=" + like);
    setStatus("Hacking: attempts remaining " + hackingAttemptsLeft);

    if (hackingAttemptsLeft <= 0) {
        renderError("SECURITY LOCKOUT.\nTerminal temporarily disabled.");
    } else {
        attachInputCursor("");
    }
}

/* ================================
   INIT
================================ */

renderBoot();
</script>
</body>
</html>
